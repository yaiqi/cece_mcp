server {
    listen 80;
    server_name mcp-xhzjds.cnfic.com.cn;

    # MCP Streamable HTTP 协议：SSE 长连接，proxy_buffering off 保证实时流式传输。
    # 不要设置 chunked_transfer_encoding off（会破坏 HTTP/1.1 下 SSE 无长度响应的传输）。

    location /cece-mcp-servers/PEVC/ {
        proxy_pass http://172.20.28.224:8907;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /cece-mcp-servers/enterprise/ {
        proxy_pass http://172.20.28.224:8908;
        proxy_http_version 1.1;
