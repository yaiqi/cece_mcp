        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /cece-mcp-servers/NER/ {
        proxy_pass http://172.20.28.224:8910;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
